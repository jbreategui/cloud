# Unico nginx del stack: sirve el build estatico del frontend (montado desde
# el volumen compartido con el servicio frontend) y hace de reverse proxy
# hacia el backend para /api/*.
client_max_body_size 100m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

  location /api/ {
      resolver 127.0.0.11 valid=10s;

      set $backend http://cloud:8080;
      proxy_pass $backend;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
  }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
