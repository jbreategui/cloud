# Solo backend. El frontend ya no corre aquí:
# se construye con "npm run build" desde frontend/
# y dist/ se sube a S3 detrás de CloudFront (https://thaki.site).
#
# Tráfico de la API:
# https://api.thaki.site -> ALB (443) -> Target Group -> EC2:8080

services:
  cloud:
    container_name: cloud

    build:
      context: ./
      dockerfile: ./Dockerfile

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SERVER_PORT: 8080
      APP_SERVER_NAME: ${APP_SERVER_NAME:-APP}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://thaki.site}

    ports:
      - "8080:8080"

    restart: always