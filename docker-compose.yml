# La base de datos Postgres corre en un EC2 aparte (ver docs/db/docker-compose.yml).
# No hay servicio "postgres" aqui ni red compartida: la app se conecta por red de
# la VPC, no por red interna de Docker. Las credenciales (host, port, dbname,
# username, password) las obtiene cloud desde AWS Secrets Manager (secreto
# "sm_posgress") usando el IAM Role de la instancia EC2 host de este compose,
# no de variables de entorno.
#
# Un solo puerto expuesto al host: el de nginx (APP_PORT). nginx reparte:
#   /api/*  -> cloud (backend)
#   /*      -> archivos estaticos del frontend (build de Vite)
#
# frontend no sirve nada: compila y copia dist/ al volumen "frontend_dist",
# que nginx monta como su document root. nginx espera a que ese contenedor
# termine bien (exit 0) antes de arrancar (depends_on con
# service_completed_successfully).
services:
  cloud:
    container_name: cloud
    build:
      context: ./
      dockerfile: ./Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SERVER_PORT: 8080
      APP_SERVER_NAME: ${APP_SERVER_NAME}
    restart: always

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    volumes:
      - frontend_dist:/dist_output
    restart: "no"

  nginx:
    container_name: nginx
    build:
      context: ./nginx
      dockerfile: ./Dockerfile
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
    ports:
      - "${APP_PORT}:80"
    depends_on:
      cloud:
        condition: service_started
      frontend:
        condition: service_completed_successfully
    restart: always

volumes:
  frontend_dist:
