
# Solo backend.
# Frontend: S3 + CloudFront (https://thaki.site).
# API: https://api.thaki.site -> EC2:443 -> Spring Boot.

services:
  cloud:
    container_name: cloud

    build:
      context: ./
      dockerfile: ./Dockerfile

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/etc/thaki/application-ssl.properties
      APP_SERVER_NAME: ${APP_SERVER_NAME:-APP}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://thaki.site}
      APP_LAMBDA_FUNCTION_NAME: ${APP_LAMBDA_FUNCTION_NAME:-thaki-blur-image}

    ports:
      - "443:443"

    volumes:
      - /etc/thaki/application-ssl.properties:/etc/thaki/application-ssl.properties:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

    restart: always
