services:
  cloud:
    container_name: cloud
    build:
      context: ./
      dockerfile: ./Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    restart: always

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    volumes:
      - frontend_dist:/dist_output
    restart: "no"

  nginx:
    container_name: nginx
    build:
      context: ./nginx
      dockerfile: ./Dockerfile
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
    ports:
      - "${APP_PORT}:80"
    depends_on:
      cloud:
        condition: service_started
      frontend:
        condition: service_completed_successfully
    restart: always

volumes:
  frontend_dist: