# Solo backend. El frontend ya no corre aqui: se construye con "npm run build"
# (frontend/) y dist/ se sube a S3 detras de CloudFront (https://thaki.site).
# Trafico de la API: https://api.thaki.site -> ALB (443) -> Target Group -> EC2:8080.
services:
  cloud:
    container_name: cloud
    build:
      context: ./
      dockerfile: ./Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SERVER_PORT: 8080
      APP_SERVER_NAME: ${APP_SERVER_NAME:-APP}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://thaki.site}
    ports:
      - "8080:8080"
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-2
        awslogs-group: /aws/ec2/cloud-app
        awslogs-stream: cloud
        awslogs-create-group: "true"
    restart: always
