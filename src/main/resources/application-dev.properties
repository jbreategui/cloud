# En dev el Postgres real de prod (VPC privada, ver DataSourceConfig) no es
# alcanzable desde tu maquina, asi que se usa un Postgres local via variables
# de entorno.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.mode=always

# Frontend local con "npm run dev".
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
