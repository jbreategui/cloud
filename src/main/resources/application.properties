spring.application.name=cloud

app.s3.bucket=bucket-jbrr
app.s3.region=us-east-2

app.dynamodb.table-name=image_likes

app.secrets.region=us-east-2
app.secrets.db-secret-id=sm_posgress

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.cloud.app.model
mybatis.configuration.map-underscore-to-camel-case=true

# Cada perfil define su propio default (dev: localhost:5173, prod: https://thaki.site).
# Sin perfil no se permite ningun origen cross-site.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

app.server.name=${APP_SERVER_NAME:APP}