# Credenciales de Postgres para prod: DataSourceConfig las obtiene de AWS Secrets
# Manager (secreto "sm_posgress", ver app.secrets.* en application.properties),
# no de spring.datasource.* ni de variables de entorno.
spring.sql.init.mode=never

# El frontend se sirve desde CloudFront (https://thaki.site) y llama a la API en
# otro origen (https://api.thaki.site, ALB -> EC2:8080), asi que necesita CORS.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://thaki.site}
