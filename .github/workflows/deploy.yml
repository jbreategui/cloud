
# CI/CD Thaki Backend
# Etapas: test + build + publicación en ECR + despliegue en EC2.
#
# Frontend: S3 + CloudFront (https://thaki.site).
# API: https://api.thaki.site -> EC2:443 -> Spring Boot.

name: CI/CD Thaki Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos por defecto.
permissions:
  contents: read

# Evita publicaciones y despliegues simultáneos.
concurrency:
  group: thaki-cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: thaki-backend

jobs:

  # 1. Compilar y ejecutar pruebas.
  test:
    name: Build & test (Maven)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile and run tests
        run: bash ./mvnw -B -ntp verify


  # 2. Construir imagen Docker y publicarla en ECR.
  build-and-push:
    name: Build & push Docker image
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-thaki-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Imagen publicada en ECR"
            echo ""
            echo "- \`${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}\`"
            echo "- \`${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"


  # 3. Copiar configuración y desplegar en EC2.
  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Copiar únicamente docker-compose.yml.
      # El archivo .env permanece en EC2.
      - name: Copy Docker Compose to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: docker-compose.yml
          target: /home/ubuntu/thaki/

      # Conectarse a EC2 y actualizar el contenedor.
      - name: Deploy application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /home/ubuntu/thaki

            echo "1. Autenticando Docker en ECR..."

            aws ecr get-login-password --region us-east-2 | docker login \
              --username AWS \
              --password-stdin 525388658102.dkr.ecr.us-east-2.amazonaws.com

            echo "2. Validando Docker Compose..."

            docker compose config --quiet

            echo "3. Descargando nueva imagen..."

            docker compose pull

            echo "4. Actualizando aplicación..."

            docker compose up -d --remove-orphans

            echo "5. Verificando contenedor..."

            docker compose ps

            echo "Despliegue finalizado."
